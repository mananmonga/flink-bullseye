# Coordinates. GROUP is an open decision (see docs/design.md, "Publishing"); io.github.<handle>
# is the no-domain fallback and is what the Central Portal grants automatically for a verified
# GitHub account.
GROUP=io.github.mananmonga
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=flink-bullseye
POM_DESCRIPTION=Periodic re-sync barrier for keyed-state side inputs in Apache Flink DataStream jobs.
POM_URL=https://github.com/mananmonga/flink-bullseye
POM_SCM_URL=https://github.com/mananmonga/flink-bullseye
POM_SCM_CONNECTION=scm:git:git://github.com/mananmonga/flink-bullseye.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/mananmonga/flink-bullseye.git
POM_LICENCE_NAME=The Apache License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=mananmonga
POM_DEVELOPER_NAME=Manan Monga
POM_DEVELOPER_URL=https://github.com/mananmonga

# Publishing target: the Central Portal (not legacy OSSRH, not GitHub Packages).
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
