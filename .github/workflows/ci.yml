name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-jdk${{ matrix.jdk }}
          path: '**/build/reports/tests/'

  consume-on-17:
    # D3 guard: publish the library from a JDK 21 build, then compile AND run a consumer on a
    # JDK 17 runtime. If `options.release = 17` ever regresses, this job fails with the same
    # class-version error a Java 17 consumer would see.
    name: Consume from JDK 17
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to mavenLocal from JDK 21
        run: ./gradlew publishToMavenLocal --no-daemon -PVERSION_NAME=0.0.0-smoke
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Compile and run the smoke consumer on JDK 17
        working-directory: smoke-consumer
        run: ../gradlew run --no-daemon -PbarrierVersion=0.0.0-smoke
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
