name: Release

# Tag-triggered publish to Maven Central via the Central Portal. Pushing `v0.1.0` publishes 0.1.0.
# No laptop ritual, no publishToMavenLocal, no SNAPSHOT pins in consumers.
#
# Required repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  – Central Portal user token
#   SIGNING_KEY                                       – ASCII-armoured GPG private key
#   SIGNING_KEY_PASSWORD                              – its passphrase
# Share the Portal namespace and the GPG key with a second maintainer on day one.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: ./gradlew build --no-daemon -PVERSION_NAME=${{ steps.v.outputs.version }}
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache -PVERSION_NAME=${{ steps.v.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bullseye-core/build/libs/*.jar
            bullseye-kafka/build/libs/*.jar
